<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<!-- Stand-in video frame for App Store screenshots: the app's snapshots cannot capture video. -->
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3B2D52"/><stop offset="1" stop-color="#16131F"/>
  </linearGradient>
  <radialGradient id="lamp" cx="0.78" cy="0.25" r="0.6">
    <stop offset="0" stop-color="#FFB86B" stop-opacity="0.45"/><stop offset="1" stop-color="#FFB86B" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="neon" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
  <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5A3E2B"/><stop offset="1" stop-color="#2E2018"/>
  </linearGradient>
  <linearGradient id="mic" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1F2227"/><stop offset="0.45" stop-color="#4A4F58"/><stop offset="1" stop-color="#15171B"/>
  </linearGradient>
  <pattern id="foam" width="80" height="80" patternUnits="userSpaceOnUse">
    <rect width="80" height="80" fill="#2A2238"/>
    <path d="M0 0 L40 40 L0 80 Z" fill="#241D31"/><path d="M80 0 L40 40 L80 80 Z" fill="#30273F"/>
  </pattern>
</defs>
<rect width="1280" height="720" fill="url(#wall)"/>
<rect width="1280" height="720" fill="url(#lamp)"/>
<rect x="70" y="150" width="400" height="320" rx="6" fill="url(#foam)" opacity="0.9"/>
<g filter="url(#blur)" opacity="0.7">
  <circle cx="980" cy="140" r="38" fill="#FFC27A"/><circle cx="1110" cy="230" r="26" fill="#FF9F68"/>
  <circle cx="860" cy="260" r="20" fill="#FFD9A0"/><circle cx="1180" cy="110" r="30" fill="#7FD3FF"/>
  <circle cx="620" cy="120" r="16" fill="#FFC27A"/>
</g>
<g transform="translate(560 190)">
  <rect x="0" y="0" width="230" height="84" rx="16" fill="none" stroke="#FF4D8D" stroke-width="10" filter="url(#neon)"/>
  <rect x="0" y="0" width="230" height="84" rx="16" fill="#1A1220" stroke="#FF7AAE" stroke-width="5"/>
  <text x="115" y="58" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="800"
        font-size="44" letter-spacing="4" fill="#FFD1E3">ON AIR</text>
</g>
<rect x="0" y="560" width="1280" height="160" fill="url(#desk)"/>
<rect x="0" y="556" width="1280" height="8" fill="#7A563C"/>
<g transform="translate(150 470)">
  <rect x="-40" y="40" width="80" height="60" rx="10" fill="#C9C2B8"/>
  <path d="M0 40 C-60 -20 -90 -40 -110 -20 C-80 -10 -50 10 0 40 Z" fill="#3E8E5C"/>
  <path d="M0 40 C40 -40 80 -60 110 -50 C80 -30 50 0 0 40 Z" fill="#4FA56C"/>
  <path d="M0 40 C-10 -40 0 -90 20 -110 C25 -70 15 -20 0 40 Z" fill="#5BB97A"/>
</g>
<path d="M1240 0 L1030 210 L900 330" fill="none" stroke="#202328" stroke-width="18" stroke-linecap="round"/>
<path d="M1240 0 L1030 210 L900 330" fill="none" stroke="#3A3E46" stroke-width="6" stroke-linecap="round"/>
<g transform="translate(860 300) rotate(-12)">
  <rect x="-70" y="0" width="140" height="300" rx="70" fill="url(#mic)"/>
  <g stroke="#5D636D" stroke-width="3" opacity="0.8">
    <line x1="-52" y1="40" x2="52" y2="40"/><line x1="-60" y1="62" x2="60" y2="62"/><line x1="-64" y1="84" x2="64" y2="84"/>
    <line x1="-66" y1="106" x2="66" y2="106"/><line x1="-66" y1="128" x2="66" y2="128"/><line x1="-64" y1="150" x2="64" y2="150"/>
  </g>
  <rect x="-74" y="176" width="148" height="18" rx="9" fill="#0F1114"/>
  <rect x="-18" y="300" width="36" height="40" rx="8" fill="#111317"/>
</g>
<g transform="translate(470 545)">
  <path d="M-80 0 C-80 -90 80 -90 80 0" fill="none" stroke="#1C1F24" stroke-width="16"/>
  <rect x="-100" y="-10" width="44" height="60" rx="18" fill="#22262C"/><rect x="56" y="-10" width="44" height="60" rx="18" fill="#22262C"/>
</g>
</svg>
