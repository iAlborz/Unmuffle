<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screenshot Preview</title>
<!-- Every Mac App Store screenshot in every language, in the order App Store Connect shows them.
     Serve the repo root (see .claude/launch.json) and open /scripts/screenshots/preview.html. -->
<style>
  :root {
    color-scheme: light;
    --bg: #f5f5f7; --panel: #fff; --line: #e3e3e8; --text: #1d1d1f; --muted: #6e6e73;
    --ok: #137a2f; --danger: #d70015;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  }
  body { margin: 0; background: var(--bg); color: var(--text); }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 20px;
           box-sizing: border-box; background: rgba(255,255,255,.92); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; }
  #status { flex: 1; color: var(--muted); text-align: right; }
  #grid { display: grid; gap: 14px 16px; padding: 10px 20px 48px; align-items: start; justify-content: start; }
  .col { position: sticky; top: 52px; z-index: 2; background: var(--bg); padding: 8px 0 4px; font-weight: 600; }
  .num { font-size: 20px; font-weight: 700; color: var(--muted); padding-top: 4px; text-align: right; }
  figure { margin: 0; display: flex; flex-direction: column; gap: 4px; }
  figure img { display: block; width: 300px; aspect-ratio: 16 / 10; border-radius: 8px; box-shadow: 0 0 0 1px var(--line);
               cursor: zoom-in; background: var(--panel); object-fit: contain; }
  .size { font-size: 11px; }
  .size.ok { color: var(--ok); }
  .size.bad { color: var(--danger); }
  dialog { padding: 0; border: 0; background: none; max-width: none; max-height: none; }
  dialog::backdrop { background: rgba(0,0,0,.65); }
  dialog img { display: block; max-height: calc(100vh - 40px); max-width: calc(100vw - 40px); cursor: zoom-out; }
</style>
</head>
<body>
<header><h1>Screenshot Preview</h1><span id="status"></span></header>
<div id="grid"></div>
<dialog id="zoom"><img alt=""></dialog>
<script>
const LANGS = ["en", "de", "es", "fr", "it", "ja", "ko", "nl", "pl", "pt-BR", "ru", "tr", "zh-Hans", "zh-Hant"];
const SCREENS = ["simple", "instant", "adv", "drop"];   // the App Store order
const SIZE = [2560, 1600];
const grid = document.getElementById("grid"), zoom = document.getElementById("zoom");
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
grid.style.gridTemplateColumns = `40px repeat(${LANGS.length}, 300px)`;
grid.append(el("div"), ...LANGS.map(l => el("div", {className: "col", textContent: l})));
let loaded = 0, bad = 0;
const total = LANGS.length * SCREENS.length;
SCREENS.forEach((screen, i) => {
  grid.append(el("div", {className: "num", textContent: i + 1, title: screen}));
  for (const lang of LANGS) {
    const size = el("span", {className: "size", textContent: "…"});
    const img = el("img", {src: `../../docs/screenshots/${lang}/${screen}.png?${Date.now()}`, alt: `${lang} ${screen}`, loading: "lazy"});
    img.onload = () => {
      const ok = img.naturalWidth === SIZE[0] && img.naturalHeight === SIZE[1];
      size.textContent = `${img.naturalWidth} × ${img.naturalHeight}`;
      size.className = "size " + (ok ? "ok" : "bad");
      loaded++; if (!ok) bad++; status();
    };
    img.onerror = () => { size.textContent = "missing"; size.className = "size bad"; loaded++; bad++; status(); };
    img.onclick = () => { zoom.querySelector("img").src = img.src; zoom.showModal(); };
    grid.append(el("figure", {}, img, size));
  }
});
zoom.onclick = () => zoom.close();
function status() {
  document.getElementById("status").textContent =
    `${LANGS.length} languages · ${SCREENS.length} screenshots each · ${loaded}/${total} loaded` + (bad ? ` · ${bad} wrong size or missing` : "");
}
status();
</script>
</body>
</html>
